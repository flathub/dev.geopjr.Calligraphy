app-id: dev.geopjr.Calligraphy
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: calligraphy
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --device=dri
  - --socket=wayland
modules:
  - python3-pyfiglet.json
  - name: calligraphy
    builddir: true
    buildsystem: meson
    run-tests: true
    sources:
      - type: git
        url: https://codeberg.org/GeopJr/Calligraphy.git
        tag: v1.3.0
        commit: 1d2a550b771637660fa2ec151f1ad70f62bea76b
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
